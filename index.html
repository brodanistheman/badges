<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Badge Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Verification Card -->
  <div id="auth-card" class="card">
    <h2>Roblox Account Verification</h2>
    <p>Enter your Roblox username to fetch your badges:</p>
    
    <div class="input-group">
      <input type="text" id="username-input" placeholder="Roblox Username">
      <button id="gen-code-btn">1. Get Code</button>
    </div>

    <div id="code-section" style="display: none;">
      <p>Paste this sentence into your Roblox profile <b>About</b> section:</p>
      <div id="verification-phrase" class="phrase-box"></div>
      <button id="verify-btn" class="primary-btn">2. Check Verification</button>
    </div>
  </div>

  <!-- Main Interface -->
  <div id="app" style="display: none;">
    <header>
      <h1>Badges Showcase</h1>
      <input type="text" id="search-bar" placeholder="Search played games...">
    </header>

    <!-- Essential element needed by app.js -->
    <div id="loading" style="padding: 10px; font-weight: bold; color: #3b82f6;">Loading badges and game details...</div>
    
    <div id="game-list" class="horizontal-scroll"></div>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
