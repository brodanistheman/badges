<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Badge Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Verification Card -->
  <div id="auth-card" class="card">
    <h2>Roblox Account Verification</h2>
    <p>Enter your Roblox username to fetch your badges:</p>
    
    <div class="input-group">
      <input type="text" id="username-input" placeholder="Enter Roblox Username">
      <button id="gen-code-btn">Fetch My Badges</button>
    </div>
  </div>

  <!-- Main Interface -->
  <div id="app" style="display: none;">
    <header>
      <h1>Badges Showcase</h1>
      <input type="text" id="search-bar" placeholder="Search badges...">
    </header>
    <div id="loading" style="padding: 10px; font-weight: bold; color: #3b82f6;">Loading badges...</div>
    <div id="game-list" class="horizontal-scroll"></div>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
